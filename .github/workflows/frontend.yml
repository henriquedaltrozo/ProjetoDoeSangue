name: frontend

# Verificações do frontend (SPA React em frontend/):
# - lint, formatação e regras de dependência entre camadas/features (Biome, `npm run lint`);
# - checagem de tipos + build de produção (`npm run build` roda `tsc -b` antes do Vite);
# - testes unitários (Vitest).
# O e2e (Playwright) não roda aqui porque precisa do backend inteiro no ar (ver frontend/README.md).
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
