name: e2e

on:
  push:
    branches: [main]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: backend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - name: Instala e compila todos os serviços
        working-directory: backend
        run: |
          pnpm install --frozen-lockfile
          for s in gateway auth eligibility scheduling notification; do
            (cd services/$s && pnpm exec nest build)
          done
      - name: Fluxo completo (cada serviço em um processo, um banco por serviço)
        working-directory: backend/tests/e2e
        env:
          DB_ADMIN_DATABASE: postgres
        run: |
          set -a; . ../../../.env.example; set +a
          pnpm exec jest --runInBand --forceExit
