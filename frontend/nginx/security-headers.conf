# Cabeçalhos de segurança, incluídos em cada `location` (um add_header dentro de uma location
# faz o nginx ignorar os add_header herdados do server, por isso o include em vez de declarar
# uma vez só no server).
add_header Content-Security-Policy $csp always;
# Não deixa o navegador "adivinhar" o tipo do arquivo (ex.: tratar um JSON como script).
add_header X-Content-Type-Options "nosniff" always;
# Impede que o site seja aberto dentro de um iframe de outro site (clickjacking).
add_header X-Frame-Options "DENY" always;
# Não envia a URL atual para outros sites: a tela de redefinição de senha leva o token na URL.
add_header Referrer-Policy "no-referrer" always;
# O app não usa câmera, microfone nem localização.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
