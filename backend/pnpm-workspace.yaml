# Workspace pnpm do backend: cada serviço em services/<serviço> (e o e2e) continua sendo um pacote
# independente, com o próprio package.json. A instalação é única, mas cada pacote só enxerga
# o que declarou (node_modules/ de cada pacote contém apenas links para as suas dependências).
packages:
  - 'services/*'
  - 'shared'
  - 'tests/*'

# pnpm 10 não roda scripts de instalação por padrão; liberar só o que precisa compilar/baixar binário.
onlyBuiltDependencies:
  - bcrypt

# Scripts opcionais que não são necessários (telemetria/acelerador nativo opcional do msgpackr).
ignoredBuiltDependencies:
  - '@nestjs/core'
  - '@scarf/scarf'
  - msgpackr-extract

# Necessário para `pnpm deploy` (usado nos Dockerfiles) no pnpm 10. Nenhum pacote do workspace declara
# outro como dependência (os serviços compilam o código-fonte do `shared` via aliases, ver docs/06, seção 2.3),
# então não altera o resultado da instalação.
injectWorkspacePackages: true

# Falha cedo se alguém usar uma versão de Node/pnpm incompatível com "engines" do package.json.
engineStrict: true

# Versões de TODAS as dependências do backend, em um lugar só. Os package.json dizem quais dependências cada
# pacote usa ("catalog:"); para atualizar uma versão, edite aqui e rode `pnpm install`.
catalog:
  '@biomejs/biome': '2.5.15'
  '@nestjs/axios': '^3.1.3'
  '@nestjs/bullmq': '^10.2.3'
  '@nestjs/cli': '^10.4.9'
  '@nestjs/common': '^10.4.15'
  '@nestjs/config': '^3.3.0'
  '@nestjs/core': '^10.4.15'
  '@nestjs/jwt': '^10.2.0'
  '@nestjs/passport': '^10.0.3'
  '@nestjs/platform-express': '^10.4.15'
  '@nestjs/schematics': '^10.2.3'
  '@nestjs/swagger': '^7.4.2'
  '@nestjs/terminus': '^10.3.0'
  '@nestjs/throttler': '^6.5.0'
  '@nestjs/typeorm': '^10.0.2'
  '@types/bcrypt': '^6.0.0'
  '@types/express': '^5.0.0'
  '@types/jest': '^29.5.14'
  '@types/node': '^22.10.5'
  '@types/nodemailer': '^8.0.1'
  '@types/passport-jwt': '^4.0.1'
  '@types/pg': '^8.23.1'
  axios: '^1.7.9'
  bcrypt: '^6.0.0'
  bullmq: '^5.34.5'
  class-transformer: '^0.5.1'
  class-validator: '^0.14.1'
  helmet: '^8.3.0'
  http-proxy-middleware: '^3.0.3'
  ioredis: '^5.4.2'
  jest: '^29.7.0'
  nodemailer: '^10.0.3'
  passport: '^0.7.0'
  passport-jwt: '^4.0.1'
  pg: '^8.13.1'
  reflect-metadata: '^0.2.2'
  rxjs: '^7.8.1'
  source-map-support: '^0.5.21'
  swagger-ui-express: '^5.0.1'
  ts-jest: '^29.2.5'
  typeorm: '^0.3.31'
  typescript: '^5.7.2'

# Correções de segurança em dependências indiretas (do NestJS 10, do axios e do swagger), sempre na
# mesma versão principal que eles já usam. Revise ao subir o NestJS para a versão 11.
overrides:
  multer: ^2.5.0
  'body-parser@1': ^1.20.9
  qs: ^6.16.1
  'js-yaml@4': ^4.3.2
  lodash: ^4.18.1
  follow-redirects: ^1.16.3
